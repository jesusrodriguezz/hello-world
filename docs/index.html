<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Streaks</title>
<meta name="description" content="A tiny offline habit tracker.">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Streaks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --text: #16181d; --muted: #6b7280;
    --line: #e5e7eb; --accent: #ff6a3d; --accent-ink: #ffffff; --done: #22c55e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1b1e25; --text: #f3f4f6; --muted: #9ca3af;
      --line: #2a2e37; --accent: #ff7a50; --accent-ink: #111318; --done: #34d399;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px);
    max-width: 560px; margin: 0 auto; min-height: 100vh;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 30px; margin: 0; letter-spacing: -0.02em; }
  #today { color: var(--muted); font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 64px 16px; }
  .empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  li {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
  }
  .name { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .week { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { text-align: center; font-size: 11px; color: var(--muted); }
  .dot {
    display: block; margin: 4px auto 0; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--line); background: transparent; padding: 0; cursor: pointer;
  }
  .dot.on { background: var(--done); border-color: var(--done); }
  .check {
    width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--line);
    background: transparent; color: var(--muted); font-size: 24px; cursor: pointer;
  }
  .check.on { background: var(--done); border-color: var(--done); color: #fff; }
  .del { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 0; cursor: pointer; }
  form {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px;
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
    background: var(--bg); border-top: 1px solid var(--line);
  }
  form > * { font: inherit; }
  input {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 16px;
  }
  form button {
    padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent);
    color: var(--accent-ink); font-weight: 600;
  }
  #hint {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font-size: 14px; color: var(--muted); margin-bottom: 16px;
  }
  #hint[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <h1>Streaks</h1>
  <span id="today"></span>
</header>

<div id="hint" hidden>
  <strong>Install it:</strong> tap <b>Share</b> → <b>Add to Home Screen</b> (iPhone),
  or <b>⋮</b> → <b>Add to Home screen</b> (Android).
</div>

<ul id="list"></ul>
<div class="empty" id="empty" hidden><b>No habits yet</b>Add one below, then tap the circle each day you do it.</div>

<form id="add" autocomplete="off">
  <input id="name" placeholder="New habit, e.g. Drink water" maxlength="60" aria-label="Habit name">
  <button>Add</button>
</form>

<script>
  const KEY = "streaks.v1";
  const $ = (id) => document.getElementById(id);

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(habits)); } catch {}
  }

  // Local calendar date as YYYY-MM-DD (not UTC, so "today" matches the phone's clock).
  function iso(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function daysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return d; }

  function streak(done) {
    const set = new Set(done);
    // A streak stays alive if today isn't checked yet but yesterday was.
    let n = 0, i = set.has(iso(daysAgo(0))) ? 0 : 1;
    while (set.has(iso(daysAgo(i)))) { n++; i++; }
    return n;
  }

  let habits = load();

  function toggle(h, date) {
    const i = h.done.indexOf(date);
    if (i >= 0) h.done.splice(i, 1); else h.done.push(date);
    if (navigator.vibrate) navigator.vibrate(10);
    save(); render();
  }

  function render() {
    const list = $("list");
    list.replaceChildren();
    $("empty").hidden = habits.length > 0;
    const today = iso(new Date());

    for (const h of habits) {
      const li = document.createElement("li");
      const s = streak(h.done);

      const info = document.createElement("div");
      const name = document.createElement("div");
      name.className = "name"; name.textContent = h.name;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${s} day streak · ${h.done.length} total · `;
      const del = document.createElement("button");
      del.className = "del"; del.textContent = "Delete";
      del.onclick = () => {
        if (confirm(`Delete "${h.name}"?`)) { habits = habits.filter((x) => x !== h); save(); render(); }
      };
      meta.append(del);
      info.append(name, meta);

      const check = document.createElement("button");
      check.className = "check" + (h.done.includes(today) ? " on" : "");
      check.textContent = "✓";
      check.setAttribute("aria-label", `Mark ${h.name} done today`);
      check.onclick = () => toggle(h, today);

      const week = document.createElement("div");
      week.className = "week";
      for (let i = 6; i >= 0; i--) {
        const d = daysAgo(i), key = iso(d);
        const cell = document.createElement("div");
        cell.className = "day";
        cell.textContent = d.toLocaleDateString(undefined, { weekday: "narrow" });
        const dot = document.createElement("button");
        dot.className = "dot" + (h.done.includes(key) ? " on" : "");
        dot.setAttribute("aria-label", `${h.name} on ${key}`);
        dot.onclick = () => toggle(h, key);
        cell.append(dot);
        week.append(cell);
      }

      li.append(info, check, week);
      list.append(li);
    }
  }

  $("add").onsubmit = (e) => {
    e.preventDefault();
    const name = $("name").value.trim();
    if (!name) return;
    habits.push({ id: Date.now(), name, done: [] });
    $("name").value = "";
    save(); render();
  };

  $("today").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });

  // Show the install hint only in a normal browser tab, not once launched from the home screen.
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  $("hint").hidden = standalone;

  // Re-render when the app comes back to the foreground on a new day.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

  render();
</script>
</body>
</html>
